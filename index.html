<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá, mundo.</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0b0b0f;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: #7c3aed;
            filter: blur(140px);
            opacity: .25;
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(90%, 650px);
            padding: 70px 40px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 28px;
            background: rgba(255,255,255,.04);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 100px rgba(0,0,0,.4);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            margin-bottom: 25px;
            border-radius: 999px;
            background: rgba(255,255,255,.07);
            color: #c4b5fd;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a78bfa;
            box-shadow: 0 0 15px #a78bfa;
        }

        h1 {
            font-size: clamp(3rem, 9vw, 6rem);
            letter-spacing: -5px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            color: transparent;
        }

        p {
            color: #999;
            font-size: 16px;
            line-height: 1.7;
        }

        footer {
            margin-top: 35px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="glow"></div>

<main class="card">
    <div class="status">
        <span class="dot"></span>
        online
    </div>

    <h1>Olá.</h1>

    <p>
        Uma página simples, bonita e pronta para o seu próximo deploy.
    </p>

    <footer>
        deployment successful · 2026
    </footer>
</main>

</body>
</html>
